name: Password Vault Python CI

on:
  push:
    paths:
      - "password_vault/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "password_vault/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: password_vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Pylint
        run: python -m pylint .
      - name: Run Bandit
        run: python -m bandit -r .
      - name: Run tests
        run: python -m pytest -q
